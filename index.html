<!DOCTYPE html>
<html>
<head>
<title>Medidor Tinaco</title>
</head>

<body>

<h1>Medir nivel</h1>

<button onclick="medir()">Medir</button>

<pre id="resultado"></pre>

<script>
function medir(){

fetch("medir.php")
.then(r=>r.json())
.then(data=>{
document.getElementById("resultado").textContent =
JSON.stringify(data,null,2)
})

}
</script>

</body>
</html>
